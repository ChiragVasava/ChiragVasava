# Optional Pac-Man animation: disabled by default to keep the recruiter-facing profile clean.
# Run manually from the Actions tab if you want to generate it.
# Its output is isolated from the contribution snake branch.
name: Generate optional Pac-Man contribution graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Pac-Man graph
        uses: Rudra00codes/pacman-github-contribution@main
        with:
          github_user_name: ChiragVasava
      - name: Publish generated files to an isolated branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
